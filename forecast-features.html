<!-- 宙の辻: 封鎖中の予測系機能(宙検索/My宙検索/宙断面)のUI部品。
     リリース方針(2026-07-20)によりindex.htmlから分離した。開発時はURLに ?forecast=1 を付けると
     script.jsのloadForecastFeaturesがこのファイルを読み込み、各スロット(ff-slot-*)へ注入する。
     公開判断が出たら、この内容をindex.htmlの各スロット位置へ戻す(またはフラグ既定をtrueに)。 -->
<template data-ff-slot="sorasearch-panel">
    <div id="sorasearch-panel" class="hidden">
        <div id="sorasearch-header"><button id="btn-sorasearch-max" title="検索結果表示領域を最大化">⛶</button> <span id="sorasearch-title">宙検索結果</span> <span id="sorasearch-status"></span> <button id="btn-sorasearch-close" title="宙検索結果パネルを閉じる">✕</button></div>
        <div id="sorasearch-content"></div>
        <div id="sorasearch-detail" class="hidden">
            <div id="sorasearch-detail-header">詳細リスト</div>
            <div id="sorasearch-detail-body"></div>
        </div>
    </div>
</template>
<template data-ff-slot="soradanmen-panel">
    <div id="soradanmen-panel" class="hidden">
        <div id="soradanmen-header"><button id="btn-soradanmen-max" title="宙断面を画面いっぱいに最大化">⛶</button> <span id="soradanmen-title">宙断面ビュー</span> <span id="soradanmen-status"></span> <button id="btn-soradanmen-close" title="宙断面ビューを閉じる">✕</button></div>
        <div id="soradanmen-ctrl-bar">
            <label class="sd-mode-radio" title="MSMの3層雲量(低/中/高)を高度帯のスラブで表示します"><input type="radio" name="sd-mode" value="layers" checked>:3層</label>
            <label class="sd-mode-radio" title="気圧面16面の雲量を実高度の輪切り(薄板)で表示します(気圧面雲量はRH近似の目安。取得は初回のみ)"><input type="radio" name="sd-mode" value="slices">:輪切り</label>
            <button id="btn-sd-play" class="nav-btn" title="時間アニメーションを再生/停止(10分刻みで送ります)">▶</button>
            <input type="range" id="sd-time-slider" min="0" max="720" step="10" value="0" title="表示時刻(基準時刻から+12時間まで。10分刻み。時間の間の雲量は補間)">
            <span id="sd-time-label" class="sora-val"></span>
            <span id="sd-legend" class="hidden"></span>
        </div>
        <div id="soradanmen-map"></div>
    </div>
</template>
<template data-ff-slot="soradanmen-btn">
                    <div class="control-row main-buttons-row">
                        <button id="btn-soradanmen" class="nav-btn main-btn" title="宙断面ビュー(骨格): 地形の3D斜め俯瞰に現在時刻の雲(低/中/高層)を実高度の空中スラブで重ねて表示します(MapLibre)">宙断面</button>
